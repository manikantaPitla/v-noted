AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Vnoted — Note-taking app backend (Lambda + API Gateway + DynamoDB)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        NOTES_TABLE: !Ref NotesTable
        JWT_SECRET: !Ref JwtSecret
        GOOGLE_CLIENT_ID: !Ref GoogleClientId

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  GoogleClientId:
    Type: String

Resources:
  # DynamoDB Table
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vnoted-notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: created_at-index
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # API Gateway
  VnotedApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # Auth Function
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/auth-bundle/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        GoogleAuth:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /auth/google
            Method: POST

  # Notes Function
  NotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/notes-bundle/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        GetNotes:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /notes
            Method: GET
        CreateNote:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /notes
            Method: POST
        GetNote:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /notes/{id}
            Method: GET
        UpdateNote:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /notes/{id}
            Method: PUT
        DeleteNote:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /notes/{id}
            Method: DELETE
        
        # Categories
        GetCategories:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /categories
            Method: GET
        CreateCategory:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /categories
            Method: POST
        UpdateCategory:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /categories/{id}
            Method: PUT
        DeleteCategory:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /categories/{id}
            Method: DELETE

        # Account Reset
        ResetAccount:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /auth/reset
            Method: POST

        # Profile Update
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /auth/profile
            Method: PUT

        # Tags
        GetTags:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /tags
            Method: GET
        CreateTag:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /tags
            Method: POST
        DeleteTag:
          Type: Api
          Properties:
            RestApiId: !Ref VnotedApi
            Path: /tags/{id}
            Method: DELETE

  # Global CORS for errors (4XX/5XX)
  GatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref VnotedApi

  GatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref VnotedApi

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${VnotedApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
